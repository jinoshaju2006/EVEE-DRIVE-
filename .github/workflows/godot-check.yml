name: Godot project check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  import-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Import project and check scripts
        run: godot --headless --editor --path . --quit
